services:
  # Web Service running FastAPI application
  - type: web
    name: doe-pdf-aggregator
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doe-scraper-db
          property: connectionString
      - key: SYNC_INTERVAL_HOURS
        value: 24
      - key: HTTP_TIMEOUT_SECONDS
        value: 30
      - key: MAX_PDF_SIZE_BYTES
        value: 10485760 # 10MB
      - key: PORT
        value: 8000
      - key: API_KEY
        generateValue: true  # Render auto-generates a random secret
      - key: ENABLE_SCRAPER_SCHEDULER
        value: false  # GitHub Actions runs sync.py on schedule; the API stays read-only

databases:
  - name: doe-scraper-db
    plan: free
